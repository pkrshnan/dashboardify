version: v2
modules:
  - path: proto
    lint:
      use:
        - STANDARD
        - COMMENTS
      except:
        # AIP standard methods return the resource itself, not a <Method>Response.
        - RPC_RESPONSE_STANDARD_NAME
        - RPC_REQUEST_RESPONSE_UNIQUE
      rpc_allow_google_protobuf_empty_responses: true
    breaking:
      use:
        - FILE
  # Vendored so builds need no Buf Schema Registry access. Not linted.
  - path: third_party/googleapis
    lint:
      ignore:
        - third_party/googleapis
