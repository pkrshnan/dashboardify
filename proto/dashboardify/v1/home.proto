syntax = "proto3";

package dashboardify.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/timeofday.proto";

// Serves the home screen, worked out on the server.
service HomeService {
  // Gets the home screen as of now.
  rpc GetHome(GetHomeRequest) returns (Home) {
    option (google.api.http) = {get: "/v1/{name=home}"};
    option (google.api.method_signature) = "name";
  }
}

// Everything the home screen shows. A computed view, never written.
message Home {
  option (google.api.resource) = {
    type: "dashboardify.app/Home"
    pattern: "home"
    singular: "home"
    plural: "homes"
  };

  // Always `home`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // IANA time zone the view was built in.
  string time_zone = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Today in that time zone.
  google.type.Date date = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the view was built.
  google.protobuf.Timestamp generate_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // One plain sentence: judgement and next action.
  string sentence = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The event on now or next today.
  NextEvent next_event = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Seven days from today.
  repeated DayAgenda days = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Overdue, Today, This week, Later, Someday.
  repeated TaskGroup task_groups = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Ten health metrics with trends.
  repeated MetricTrend metrics = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When strap data last arrived. Unset before the first upload.
  HealthSync health_sync = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When calendars last synced. Unset when no calendar is connected.
  CalendarSync calendar_sync = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the capture box needs to guess a calendar. Unset with no writable calendar.
  CaptureHints capture_hints = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// When strap data last reached the server.
message HealthSync {
  // The newest stored sample.
  google.protobuf.Timestamp latest_sample_time = 1;

  // When the last upload landed.
  google.protobuf.Timestamp upload_time = 2;
}

// How a change reads against baseline.
enum Tone {
  // Not set.
  TONE_UNSPECIFIED = 0;
  // Better than baseline.
  TONE_GOOD = 1;
  // Worse than baseline.
  TONE_BAD = 2;
  // Within normal range.
  TONE_NEUTRAL = 3;
}

// A calendar event.
message AgendaEvent {
  // Event title.
  string title = 1;

  // Local start time.
  google.type.TimeOfDay start_time = 2;

  // Local end time.
  google.type.TimeOfDay end_time = 3;

  // Minutes after local midnight.
  int32 start_minute = 4;

  // Minutes after local midnight. Can pass 1440.
  int32 end_minute = 5;

  // Location or notes.
  string detail = 6;

  // work, fitness, personal or focus.
  string category = 7;

  // Join link, if any.
  string url = 8;

  // The event, `events/{event}`, for opening and editing.
  string event = 9;

  // Its calendar, `calendarAccounts/{calendar_account}/calendars/{calendar}`.
  string calendar = 10;

  // Whether it can be edited here.
  bool writable = 11;

  // Whether it lasts whole days. All-day events are in `all_day_events`, never in `events`.
  bool all_day = 12;

  // An Apple Maps link to its location. Set only when the location has coordinates.
  string maps_uri = 13;
}

// The event on now or next.
message NextEvent {
  // Event title.
  string title = 1;

  // Local start time.
  google.type.TimeOfDay start_time = 2;

  // Location or notes.
  string detail = 3;

  // Minutes until it starts. 0 or less while it is on.
  int32 minutes_until = 4;

  // Join link, if any.
  string url = 5;

  // An Apple Maps link to its location. Set only when the location has coordinates.
  string maps_uri = 6;
}

// A timed task, drawn on the timeline.
message Reminder {
  // The task, `tasks/{task}`.
  string task = 1 [(google.api.resource_reference).type = "dashboardify.app/Task"];

  // Task text.
  string text = 2;

  // Local due time.
  google.type.TimeOfDay time = 3;

  // Minutes after local midnight.
  int32 minute = 4;

  // Whether it is ticked off.
  bool done = 5;
}

// One day of the Day and Week views.
message DayAgenda {
  // The day.
  google.type.Date date = 1;

  // Calendar events.
  repeated AgendaEvent events = 2;

  // Timed tasks.
  repeated Reminder reminders = 3;

  // Text of untimed tasks due that day.
  repeated string dated_tasks = 4;

  // All-day events on this day, shown as Week view markers only.
  repeated AgendaEvent all_day_events = 5;
}

// A task in the task list.
message TaskItem {
  // The task, `tasks/{task}`.
  string task = 1 [(google.api.resource_reference).type = "dashboardify.app/Task"];

  // Task text.
  string text = 2;

  // Short due label, such as "3d late" or "Fri 15:00".
  string meta = 3;
}

// A heading in the task list.
message TaskGroup {
  // Overdue, Today, This week, Later or Someday.
  string display_name = 1;

  // Tasks under it.
  repeated TaskItem tasks = 2;
}

// Mean and SD of the 60 days before the last 7.
message Baseline {
  // Mean.
  double mean = 1;

  // Standard deviation.
  double sd = 2;
}

// One health metric and its trend.
message MetricTrend {
  // Stable key, such as "recovery".
  string key = 1;

  // Shown name.
  string display_name = 2;

  // Unit, such as "ms".
  string unit = 3;

  // heart, sleep, activity or vitals.
  string group = 4;

  // Formatted value, such as "7h 12m". Unset when there is none.
  optional string value = 5;

  // Raw value, for the recovery colour band.
  optional double raw_value = 6;

  // Change against baseline, such as "-11%".
  optional string delta = 7;

  // Good, bad or neutral.
  Tone tone = 8;

  // True for cumulative metrics, whose last daily value is today's running total. It is
  // left out of the change.
  bool partial_today = 9;

  // Unset without enough history.
  Baseline baseline = 10;

  // Daily values, oldest first, ending at last_date.
  repeated double daily_values = 11;

  // Indexes into daily_values with no data.
  repeated uint32 missing_days = 12;

  // Date of the last daily value.
  google.type.Date last_date = 13;

  // Yesterday's completed total, formatted, for cumulative metrics. Unset otherwise.
  optional string yesterday_value = 14;
}

// Request for GetHome.
message GetHomeRequest {
  // Always `home`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "dashboardify.app/Home",
    (buf.validate.field).string.min_len = 1
  ];
}

// When calendars last synced, for "Calendar synced 09:10".
message CalendarSync {
  // The oldest successful sync across shown calendars. Unset before the first one finishes.
  google.protobuf.Timestamp last_sync_time = 1;

  // Whether any account is signed out or unreachable.
  bool has_errors = 2;
}

// What the capture box needs to pick a calendar the way the server will.
message CaptureHints {
  // Calendars new events can go on.
  repeated WritableCalendar calendars = 1;

  // The default calendar.
  string default_calendar = 2;

  // Keyword rules, in order.
  repeated CaptureRule rules = 3;

  // Past titles and where they were, most frequent first (at most 300, past 180 days).
  repeated TitleHint titles = 4;
}

// A calendar new events can go on.
message WritableCalendar {
  // `calendarAccounts/{calendar_account}/calendars/{calendar}`.
  string name = 1;

  // Its name in Apple Calendar.
  string display_name = 2;

  // `work`, `fitness`, `personal` or `focus`.
  string category = 3;
}

// "gym, run, swim → Fitness".
message CaptureRule {
  // Whole words or phrases.
  repeated string words = 1;

  // The calendar.
  string calendar = 2;
}

// How often a title was on a calendar.
message TitleHint {
  // The title in lower case, with times and punctuation removed.
  string title_key = 1;

  // The calendar.
  string calendar = 2;

  // How many events had this title there.
  int32 count = 3;

  // When the newest one was.
  google.protobuf.Timestamp last_time = 4;
}
