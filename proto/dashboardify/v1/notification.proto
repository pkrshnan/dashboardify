syntax = "proto3";

package dashboardify.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Reminders sent with Web Push: when they go, and the browsers that get them.
service NotificationService {
  // Returns when reminders go, and the key browsers subscribe with.
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (NotificationSettings) {
    option (google.api.http) = {get: "/v1/{name=notificationSettings}"};
    option (google.api.method_signature) = "name";
  }

  // Changes the fields in the update mask, or every field that is set.
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (NotificationSettings) {
    option (google.api.http) = {
      patch: "/v1/{notification_settings.name=notificationSettings}"
      body: "notification_settings"
    };
    option (google.api.method_signature) = "notification_settings,update_mask";
  }

  // Adds this browser, or updates its keys if its endpoint is already here.
  rpc CreatePushSubscription(CreatePushSubscriptionRequest) returns (PushSubscription) {
    option (google.api.http) = {
      post: "/v1/pushSubscriptions"
      body: "push_subscription"
    };
    option (google.api.method_signature) = "push_subscription";
  }

  // Lists every browser that gets reminders, oldest first.
  rpc ListPushSubscriptions(ListPushSubscriptionsRequest) returns (ListPushSubscriptionsResponse) {
    option (google.api.http) = {get: "/v1/pushSubscriptions"};
  }

  // Stops reminders to one browser.
  rpc DeletePushSubscription(DeletePushSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=pushSubscriptions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Sends "Notifications work" to the calling device's browsers now.
  rpc TestNotification(TestNotificationRequest) returns (TestNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/pushSubscriptions:test"
      body: "*"
    };
  }
}

// When reminders go. One set for every device.
message NotificationSettings {
  option (google.api.resource) = {
    type: "dashboardify.app/NotificationSettings"
    pattern: "notificationSettings"
    singular: "notificationSettings"
    plural: "notificationSettings"
  };

  // Always `notificationSettings`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Minutes before a timed event starts, such as 60 and 10. Empty turns event reminders off.
  repeated int32 event_offset_minutes = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated = {
      max_items: 3
      unique: true
      items: {
        int32: {
          gte: 1
          lte: 1440
        }
      }
    }
  ];

  // A reminder at the due time of each open task that has one.
  optional bool task_reminders = 3 [(google.api.field_behavior) = OPTIONAL];

  // The server's VAPID public key, base64url, for `PushManager.subscribe()`.
  string public_key = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A browser that gets reminders: what `PushManager.subscribe()` returned there.
message PushSubscription {
  option (google.api.resource) = {
    type: "dashboardify.app/PushSubscription"
    pattern: "pushSubscriptions/{push_subscription}"
    singular: "pushSubscription"
    plural: "pushSubscriptions"
  };

  // `pushSubscriptions/{id}`, where `{id}` is the first 16 hex digits of the endpoint's
  // SHA-256, so a browser can find its own.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The push service address. Only Apple's, Google's, Mozilla's and Microsoft's are accepted.
  string endpoint = 2 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      uri: true
      max_len: 2000
    }
  ];

  // The browser's P-256 public key, base64url (`keys.p256dh`).
  string p256dh = 3 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 80
      max_len: 100
    }
  ];

  // The browser's auth secret, base64url (`keys.auth`).
  string auth = 4 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 16
      max_len: 32
    }
  ];

  // What to call it, such as "iPhone". The web app sets it from the browser.
  string display_name = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 100
  ];

  // The device that added it: `devices/{device}`, or `tailnet:{login}`.
  string device = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was added.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for GetNotificationSettings.
message GetNotificationSettingsRequest {
  // Always `notificationSettings`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "dashboardify.app/NotificationSettings",
    (buf.validate.field).string.const = "notificationSettings"
  ];
}

// Request for UpdateNotificationSettings.
message UpdateNotificationSettingsRequest {
  // The new values; `name` must be `notificationSettings`.
  NotificationSettings notification_settings = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // `event_offset_minutes` and/or `task_reminders`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for CreatePushSubscription.
message CreatePushSubscriptionRequest {
  // The browser's subscription.
  PushSubscription push_subscription = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// Request for ListPushSubscriptions.
message ListPushSubscriptionsRequest {}

// Response for ListPushSubscriptions.
message ListPushSubscriptionsResponse {
  // Every subscription, oldest first.
  repeated PushSubscription push_subscriptions = 1;
}

// Request for DeletePushSubscription.
message DeletePushSubscriptionRequest {
  // `pushSubscriptions/{id}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "dashboardify.app/PushSubscription",
    (buf.validate.field).string.pattern = "^pushSubscriptions/[0-9a-f]{16}$"
  ];
}

// Request for TestNotification.
message TestNotificationRequest {}

// Response for TestNotification.
message TestNotificationResponse {
  // Browsers the push service accepted it for.
  int32 sent = 1;

  // Browsers it couldn't reach. Ones the push service says are gone are removed.
  int32 failed = 2;
}
