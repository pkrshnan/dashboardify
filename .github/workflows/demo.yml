# Runs `bun run demo` from a pull request and opens it on a temporary public URL, so a change
# can be tried in a browser before merging. Add the `demo` label to a PR to start it; each push
# to a labelled PR restarts it with the new code. It stops when the PR is merged or closed, the
# label is removed, or the run is cancelled.
# The demo only has made-up data and its sign-in token is in scripts/demo.ts.
name: Demo

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep the demo up (at most 60)
        default: "30"

permissions:
  contents: read
  pull-requests: write

# A new run in a PR's group cancels its live demo: a push restarts it, and closing the PR or
# removing the label stops it (that run's job is skipped). Other label changes get a group of
# their own, so they leave the demo alone.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'synchronize' ||
         github.event.action == 'closed' || github.event.label.name == 'demo')
        && format('demo-{0}', github.event.pull_request.number || github.ref)
        || format('demo-other-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CLOUDFLARED_VERSION: 2026.10.3
  CLOUDFLARED_SHA256: 053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0
  PORT: "8788"

jobs:
  demo:
    # Only for PRs labelled `demo` from this repository, since the run comments on the PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'demo') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action == 'synchronize' || github.event.label.name == 'demo'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      MINUTES: ${{ inputs.minutes || '30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Start the demo
        env:
          DEMO_DEV: "0"
        run: |
          nohup bun run demo > demo.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors "http://localhost:$PORT/healthz"

      - name: Open a tunnel
        run: |
          curl -sSLo cloudflared "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url "http://localhost:$PORT" > tunnel.log 2>&1 &
          for _ in $(seq 60); do
            url=$(grep -m1 -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log) && break
            sleep 1
          done
          if [ -z "$url" ]; then cat tunnel.log; exit 1; fi
          # The new hostname can take a few seconds to resolve. Fetch the page, not just the API,
          # so a page the browser can't load fails here.
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null "$url/"
          echo "URL=$url" >> "$GITHUB_ENV"

      - name: Share the link
        run: |
          token=$(grep -oE 'demo-token-[0-9]+' scripts/demo.ts | head -1)
          minutes=$(( MINUTES > 60 ? 60 : MINUTES ))
          echo "KEEP_MINUTES=$minutes" >> "$GITHUB_ENV"
          until=$(date -u -d "+$minutes min" +%H:%M)
          sha=$(git rev-parse --short HEAD)
          body="**Demo of \`$sha\`:** $URL — sign in with \`$token\`. Up until $until UTC, or until the [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) is cancelled."
          echo "::notice title=Demo::$URL (token $token)"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          pr=${{ github.event.pull_request.number || '' }}
          pr=${pr:-$(gh pr view "$GITHUB_REF_NAME" --json number -q .number 2>/dev/null || true)}
          if [ -n "$pr" ]; then
            echo "PR=$pr" >> "$GITHUB_ENV"
            gh pr comment "$pr" --edit-last --create-if-none --body "$body"
          fi

      - name: Keep the demo up
        run: sleep $(( KEEP_MINUTES * 60 ))

      - name: Say the demo ended
        if: (success() || cancelled()) && env.PR
        run: gh pr comment "$PR" --edit-last --body "Demo ended. Push a commit, or remove and re-add the \`demo\` label, to start another."

      - name: Server log
        if: always()
        run: cat demo.log || true
