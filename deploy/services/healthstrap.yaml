# Syncs the WHOOP strap and uploads to dashboardify. The container has no Bluetooth of its own:
# it drives the host's BlueZ over the system D-Bus socket. Pair the strap on the host first
# (README.md, "Bluetooth").
#
# It runs as root inside the container because BlueZ's D-Bus policy only lets root and the
# bluetooth group use the adapter. All Linux capabilities are dropped, so root here can talk to
# BlueZ and write its own store, and little else.
services:
  healthstrap:
    build:
      context: ${HEALTHSTRAP_SRC:-https://github.com/pkrshnan/healthstrap.git#main}
      dockerfile: deploy/Dockerfile
    image: homeserver/healthstrap
    command: ["daemon", "--server", "http://dashboardify:8787", "--db", "/data/healthstrap.db"]
    environment:
      HEALTHSTRAP_TOKEN: ${HEALTHSTRAP_TOKEN:?set HEALTHSTRAP_TOKEN in .env}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - ${DATA_DIR:?set DATA_DIR in .env}/healthstrap:/data
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    depends_on: [dashboardify]
    restart: unless-stopped
